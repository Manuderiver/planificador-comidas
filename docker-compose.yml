services:
  database:
    image: postgres:15-alpine
    container_name: planificador_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - planificador_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - planificador_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: planificador_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3001:3001"
      - "9229:9229"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - planificador_backend_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy
    networks:
      - planificador_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: planificador_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      FAST_REFRESH: "true"
      WDS_SOCKET_HOST: localhost
      WDS_SOCKET_PORT: 3000
      WDS_SOCKET_PATH: /ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - planificador_frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - planificador_network
    stdin_open: true
    tty: true

  caddy:
    image: caddy:2-alpine
    container_name: planificador_caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - planificador_caddy_data:/data
    depends_on:
      - frontend
      - backend
    networks:
      - planificador_network

  redis:
    image: redis:7-alpine
    container_name: planificador_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - planificador_redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - planificador_network

  pgadmin:
    build:
      context: ./pgadmin
      dockerfile: Dockerfile
      args:
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
    container_name: planificador_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - planificador_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database
    networks:
      - planificador_network

volumes:
  planificador_postgres_data:
  planificador_redis_data:
  planificador_frontend_node_modules:
  planificador_backend_node_modules:
  planificador_pgadmin_data:
  planificador_caddy_data:

networks:
  planificador_network:
    driver: bridge